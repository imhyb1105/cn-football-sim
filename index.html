<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>国足世界杯闯关模拟器：重制版</title>
  <style>
    :root {
      --bg: #08111f;
      --panel: rgba(8, 15, 27, 0.76);
      --panel-strong: rgba(9, 18, 32, 0.88);
      --text: #f6f1e9;
      --muted: #c9c1b6;
      --gold: #f7c14b;
      --red: #d93f39;
      --green: #3bb273;
      --blue: #4da8ff;
      --line: rgba(255, 255, 255, 0.14);
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: #02070f;
      overflow: hidden;
    }

    button,
    select {
      font: inherit;
    }

    #app {
      height: 100dvh;
      background-size: cover;
      background-position: center;
      position: relative;
      overflow: hidden;
    }

    #app::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(4, 7, 12, 0.3), rgba(4, 8, 15, 0.8)),
        radial-gradient(circle at top, rgba(255, 220, 130, 0.16), transparent 35%);
      pointer-events: none;
    }

    .shell {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100%;
      padding: 14px;
      gap: 14px;
    }

    .scoreboard {
      border: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(7, 11, 18, 0.9), rgba(14, 23, 38, 0.82)),
        url("./assets/textures/texture_tactics_board.jpg") center/cover;
      box-shadow: var(--shadow);
      border-radius: 18px;
      overflow: hidden;
    }

    .scoreboard-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px 8px;
      background: rgba(0, 0, 0, 0.28);
      border-bottom: 1px solid var(--line);
      letter-spacing: 0.04em;
    }

    .scoreboard-top strong {
      font-size: 18px;
    }

    .scoreboard-top span {
      color: var(--muted);
      font-size: 13px;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(7, minmax(74px, 1fr));
      gap: 0;
    }

    .metric {
      padding: 10px 8px;
      border-right: 1px solid var(--line);
      text-align: center;
    }

    .metric.metric-button {
      appearance: none;
      width: 100%;
      background: transparent;
      color: inherit;
      border: 0;
      cursor: pointer;
      transition: background 0.16s ease;
    }

    .metric.metric-button:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .metric:last-child {
      border-right: none;
    }

    .metric-value {
      display: block;
      font-size: 22px;
      font-weight: 700;
      color: #fff3c4;
      text-shadow: 0 0 12px rgba(255, 205, 92, 0.35);
    }

    .metric-label {
      display: block;
      margin-top: 3px;
      font-size: 11px;
      color: var(--muted);
    }

    .main {
      display: grid;
      grid-template-columns: minmax(280px, 0.78fr) minmax(520px, 1.22fr);
      gap: 12px;
      min-height: 0;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(9px);
      overflow: hidden;
      min-height: 0;
    }

    .hero {
      display: flex;
      flex-direction: column;
      min-height: 0;
      background:
        linear-gradient(180deg, rgba(5, 8, 13, 0.18), rgba(5, 8, 13, 0.6)),
        rgba(6, 10, 18, 0.2);
    }

    .hero-head {
      display: grid;
      gap: 12px;
      padding: 16px 16px 8px;
    }

    .hero-topline {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .hero-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .phase-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid var(--line);
      color: #ffecc0;
      font-size: 13px;
    }

    .hero-title {
      margin: 0;
      font-size: clamp(24px, 2.5vw, 34px);
      line-height: 1.08;
    }

    .hero-subtitle {
      margin: 0;
      max-width: 680px;
      color: var(--muted);
      line-height: 1.45;
      font-size: 13px;
    }

    .hero-body {
      margin-top: auto;
      padding: 10px 14px 14px;
      display: grid;
      gap: 10px;
      align-content: end;
      grid-template-columns: minmax(0, 1fr);
    }

    .objective,
    .warning-box,
    .standing-box,
    .ticker {
      border-radius: 16px;
      border: 1px solid var(--line);
      background: rgba(7, 12, 20, 0.58);
      padding: 10px 12px;
    }

    .box-title {
      font-size: 13px;
      color: #ffe3a0;
      margin-bottom: 6px;
      letter-spacing: 0.05em;
    }

    .objective p,
    .warning-box p,
    .ticker p {
      margin: 0;
      color: var(--text);
      line-height: 1.5;
      font-size: 13px;
    }

    .warning-box {
      border-color: rgba(255, 94, 94, 0.34);
      background: rgba(71, 18, 18, 0.42);
    }

    .warning-box .box-title {
      color: #ffb2a6;
    }

    .ticker p + p {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .content {
      display: flex;
      flex-direction: column;
      background:
        linear-gradient(180deg, rgba(8, 14, 25, 0.86), rgba(9, 18, 32, 0.92)),
        url("./assets/textures/texture_tactics_board.jpg") center/cover;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.18);
      flex: 0 0 auto;
    }

    .panel-head h2 {
      margin: 0;
      font-size: 18px;
    }

    .panel-head small {
      color: var(--muted);
      display: block;
      margin-top: 4px;
      font-size: 12px;
    }

    .panel-body {
      padding: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      flex: 1 1 auto;
      gap: 0;
      min-height: 0;
      position: relative;
      overscroll-behavior: contain;
    }

    .panel-scale-frame {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      height: auto;
      overflow: hidden;
    }

    .panel-scale-inner {
      display: grid;
      gap: var(--panel-inner-gap, 12px);
      align-content: start;
      min-height: 0;
      width: 100%;
      transform-origin: top left;
      transform: scale(var(--panel-scale, 1));
      will-change: transform;
    }

    .content[data-view="intro"] .panel-head small,
    .content[data-view="coach"] .panel-head small,
    .content[data-view="sponsor"] .panel-head small,
    .content[data-view="round"] .panel-head small {
      display: none;
    }

    .content[data-view="intro"] .panel-head,
    .content[data-view="coach"] .panel-head,
    .content[data-view="sponsor"] .panel-head,
    .content[data-view="round"] .panel-head {
      padding: 12px 14px;
    }

    .content[data-view="coach"] .panel-head,
    .content[data-view="sponsor"] .panel-head,
    .content[data-view="round"] .panel-head {
      display: none;
    }

    .panel-body[data-view="intro"],
    .panel-body[data-view="coach"],
    .panel-body[data-view="sponsor"],
    .panel-body[data-view="round"],
    .panel-body[data-view="match-choice"],
    .panel-body[data-view="playoff"],
    .panel-body[data-view="group-qualified"] {
      --panel-inner-gap: 12px;
    }

    .panel-body[data-view="coach"],
    .panel-body[data-view="sponsor"],
    .panel-body[data-view="round"] {
      padding: 8px;
      --panel-inner-gap: 8px;
    }

    .panel-body[data-view="match-setup"] {
      padding: 8px;
      --panel-inner-gap: 8px;
    }

    .view-toggle {
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(0, 0, 0, 0.26);
      color: #ffe9ba;
      border-radius: 999px;
      min-height: 38px;
      padding: 8px 12px;
      cursor: pointer;
      transition: transform 0.16s ease, background 0.16s ease;
    }

    .view-toggle:hover {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 0.1);
    }

    .drawer-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.42);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 3;
    }

    .drawer-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-panel {
      position: absolute;
      top: 14px;
      right: 14px;
      bottom: 14px;
      width: min(360px, calc(100vw - 28px));
      display: flex;
      flex-direction: column;
      border-radius: 20px;
      border: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(6, 11, 18, 0.94), rgba(8, 13, 21, 0.98)),
        url("./assets/textures/texture_paper_news.jpg") center/cover;
      box-shadow: var(--shadow);
      transform: translateX(calc(100% + 24px));
      transition: transform 0.22s ease;
      z-index: 4;
      overflow: hidden;
    }

    .drawer-panel.open {
      transform: translateX(0);
    }

    .drawer-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(5, 10, 18, 0.46);
    }

    .drawer-head h3 {
      margin: 0;
      font-size: 18px;
    }

    .drawer-close {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      cursor: pointer;
    }

    .drawer-tabs {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      padding: 12px 16px 0;
      background: rgba(5, 10, 18, 0.3);
    }

    .drawer-tab {
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.05);
      color: var(--muted);
      min-height: 40px;
      padding: 8px 10px;
      font-size: 12px;
      cursor: pointer;
    }

    .drawer-tab.active {
      color: #ffe9ba;
      background: rgba(247, 193, 75, 0.12);
      border-color: rgba(247, 193, 75, 0.35);
    }

    .drawer-body {
      min-height: 0;
      overflow: hidden;
      flex: 1 1 auto;
      padding: 12px 16px 16px;
    }

    .drawer-view {
      display: none;
      height: 100%;
      min-height: 0;
    }

    .drawer-view.active {
      display: flex;
      flex-direction: column;
    }

    .news-list {
      overflow: auto;
      display: grid;
      gap: 12px;
      align-content: start;
      min-height: 0;
      padding-right: 4px;
    }

    .news-item {
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(9, 15, 25, 0.6);
      padding: 14px;
      border-radius: 16px;
    }

    .news-item strong {
      display: block;
      font-size: 14px;
      color: #ffe4a2;
      margin-bottom: 6px;
      line-height: 1.5;
    }

    .news-item p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .drawer-view .standing-box,
    .drawer-view .ticker {
      display: block !important;
      overflow: auto;
      min-height: 0;
      height: 100%;
    }

    .choices-grid {
      display: grid;
      gap: 12px;
    }

    .coach-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }

    .sponsor-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
    }

    .strategy-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
    }

    .strategy-card,
    .choice-card,
    .info-card,
    .result-card,
    .selection-card {
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);
      padding: 16px;
    }

    .compact-card {
      padding: 14px;
    }

    .strategy-card h3,
    .choice-card h3,
    .selection-card h3 {
      margin: 0 0 6px;
      font-size: 18px;
    }

    .strategy-card p,
    .choice-card p,
    .selection-card p,
    .info-card p,
    .result-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
      font-size: 14px;
    }

    .card-meta {
      margin-top: 10px;
      color: #ffd58f;
      font-size: 13px;
      line-height: 1.5;
    }

    .lead-card {
      display: grid;
      gap: 10px;
    }

    .content[data-view="sponsor"] .lead-card,
    .content[data-view="intro"] .lead-card {
      gap: 8px;
    }

    .content[data-view="sponsor"] .lead-card.info-card,
    .content[data-view="coach"] .lead-card.info-card,
    .content[data-view="round"] .lead-card.info-card {
      padding: 12px 14px;
    }

    .lead-card .lead-kicker {
      color: #ffe4a2;
      font-size: 13px;
      letter-spacing: 0.08em;
    }

    .lead-card h3 {
      margin: 0;
      font-size: 26px;
      line-height: 1.15;
    }

    .content[data-view="sponsor"] .lead-card h3,
    .content[data-view="coach"] .lead-card h3,
    .content[data-view="round"] .lead-card h3 {
      font-size: 22px;
      line-height: 1.1;
    }

    .content[data-view="sponsor"] .lead-card p,
    .content[data-view="coach"] .lead-card p,
    .content[data-view="round"] .lead-card p {
      font-size: 13px;
      line-height: 1.45;
    }

    .lead-split {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(220px, 0.95fr);
      gap: 12px;
      align-items: stretch;
    }

    .lead-side {
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.04);
      padding: 12px;
      display: grid;
      gap: 6px;
      align-content: start;
    }

    .content[data-view="sponsor"] .lead-side,
    .content[data-view="intro"] .lead-side {
      padding: 12px;
      gap: 6px;
    }

    .content[data-view="sponsor"] .lead-side strong,
    .content[data-view="coach"] .lead-side strong,
    .content[data-view="round"] .lead-side strong {
      font-size: 14px;
    }

    .content[data-view="sponsor"] .lead-side .bullet-list,
    .content[data-view="coach"] .lead-side .bullet-list,
    .content[data-view="round"] .lead-side .bullet-list {
      gap: 4px;
      font-size: 12px;
    }

    .lead-side strong {
      color: #fff1c7;
      font-size: 15px;
    }

    .step-console {
      display: grid;
      gap: 8px;
      min-height: 0;
    }

    .step-console.compact {
      gap: 8px;
    }

    .step-head {
      display: grid;
      gap: 6px;
      padding: 8px 10px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.04);
    }

    .step-kicker {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      font-size: 12px;
      color: #ffe4a2;
      letter-spacing: 0.04em;
    }

    .step-head strong {
      font-size: 16px;
      color: #fff7dc;
    }

    .step-head p {
      margin: 0;
      color: var(--muted);
      line-height: 1.45;
      font-size: 12px;
    }

    .content[data-view="coach"] .step-head p,
    .content[data-view="sponsor"] .step-head p,
    .content[data-view="round"] .step-head p {
      line-height: 1.35;
      font-size: 11.5px;
    }

    .step-track {
      display: grid;
      grid-template-columns: repeat(var(--step-count, 3), minmax(0, 1fr));
      gap: 6px;
    }

    .step-pill {
      appearance: none;
      min-width: 0;
      padding: 6px 8px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.04);
      color: rgba(255, 241, 199, 0.72);
      font-size: 10.5px;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      transition: transform 0.16s ease, background 0.16s ease, border-color 0.16s ease;
      text-align: left;
    }

    .step-pill.active {
      color: #0d1320;
      background: linear-gradient(180deg, rgba(248, 214, 112, 0.98), rgba(219, 161, 60, 0.98));
      border-color: rgba(255, 228, 162, 0.5);
      font-weight: 700;
    }

    .step-pill:hover {
      transform: translateY(-1px);
      border-color: rgba(255, 228, 162, 0.28);
    }

    .focus-card {
      display: grid;
      gap: 8px;
      min-height: 0;
      align-content: start;
    }

    .focus-card p {
      margin: 0;
    }

    .focus-card .card-meta,
    .focus-card .feed-note {
      margin-top: 0;
    }

    .focus-card .feed-note {
      font-size: 12px;
      line-height: 1.4;
    }

    .coach-mini-intro {
      display: grid;
      grid-template-columns: 64px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
    }

    .coach-mini-intro img {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.14);
    }

    .coach-mini-intro p {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
    }

    .focus-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .coach-header {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: 14px;
      align-items: center;
    }

    .coach-card {
      display: grid;
      gap: 8px;
    }

    .panel-body[data-view="coach"] .choice-card,
    .panel-body[data-view="sponsor"] .choice-card,
    .panel-body[data-view="round"] .info-card {
      padding: 12px;
    }

    .sponsor-card,
    .strategy-compact-card {
      display: grid;
      gap: 8px;
      align-content: start;
    }

    .coach-card p,
    .sponsor-card p,
    .strategy-compact-card p {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
    }

    .sponsor-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .mini-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 11px;
      color: #ffe4a2;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .coach-card .card-meta {
      margin-top: 0;
    }

    .coach-card .feed-note {
      margin-top: 0;
      font-size: 12px;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .btn {
      border: none;
      border-radius: 14px;
      padding: 12px 16px;
      cursor: pointer;
      color: #0d1320;
      background: linear-gradient(180deg, #f8d670, #dba13c);
      font-weight: 700;
      min-height: 46px;
      transition: transform 0.16s ease, filter 0.16s ease, opacity 0.16s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
    }

    .btn.secondary {
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .btn.ghost {
      color: #ffe0ab;
      background: rgba(255, 201, 95, 0.08);
      border: 1px solid rgba(255, 201, 95, 0.2);
    }

    .btn.full {
      width: 100%;
    }

    .two-col {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .three-col {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .setup-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .compact-options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .compact-options.four {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .selection-card input[type="radio"] {
      display: none;
    }

    .selection-card label {
      display: block;
      border-radius: 14px;

    .pixel-match-stage {
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background:
        linear-gradient(180deg, rgba(6, 10, 18, 0.3), rgba(6, 10, 18, 0.78)),
        linear-gradient(90deg, rgba(24, 88, 54, 0.96), rgba(18, 68, 42, 0.96));
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
    }

    .pixel-stage-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: rgba(5, 8, 12, 0.68);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-family: "Courier New", monospace;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .pixel-stage-head strong {

      font-size: 13px;
    }

    .pixel-stage-head span {
      color: #c7d4ea;
      font-size: 12px;

    .pixel-pitch {
      position: relative;
      height: 188px;
      overflow: hidden;
      background:
        repeating-linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.02) 0 28px,
          rgba(255, 255, 255, 0.055) 28px 56px
        ),
        repeating-linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.05) 0 3px,
          rgba(0, 0, 0, 0) 3px 6px
        ),
        linear-gradient(180deg, rgba(38, 130, 82, 0.98), rgba(22, 92, 57, 0.98));
      image-rendering: pixelated;
    }

    .pixel-pitch::before,
    .pixel-pitch::after {
      content: "";
      position: absolute;
      inset: 12px;
      border: 2px solid rgba(240, 248, 255, 0.7);
      pointer-events: none;
    }

    .pixel-pitch::after {
      inset: 12px auto 12px 50%;
      width: 0;
      border-left: 2px solid rgba(240, 248, 255, 0.6);
      border-top: 0;
      border-right: 0;
      border-bottom: 0;
    }

    .pixel-center-circle,
    .pixel-penalty-box,
    .pixel-goal-box {
      position: absolute;
      border: 2px solid rgba(240, 248, 255, 0.65);
      pointer-events: none;
    }

    .pixel-center-circle {
      top: 50%;
      left: 50%;
      width: 42px;
      height: 42px;
      margin: -21px 0 0 -21px;
      border-radius: 50%;
    }

    .pixel-penalty-box.left {

      height: 100px;
      border-right: 2px solid rgba(240, 248, 255, 0.65);
    }

    .pixel-penalty-box.right {

      height: 100px;
      border-left: 2px solid rgba(240, 248, 255, 0.65);
    }

    .pixel-goal-box.left {

      width: 28px;
      height: 52px;
      border-right: 2px solid rgba(240, 248, 255, 0.65);
    }

    .pixel-goal-box.right {
      top: 68px;
      right: 12px;
      width: 28px;
      height: 52px;
      border-left: 2px solid rgba(240, 248, 255, 0.65);
    }

    .pixel-crowd {
      position: absolute;
      inset: 0 0 auto;
      height: 18px;
      background:
        repeating-linear-gradient(
          90deg,
          rgba(255, 204, 113, 0.92) 0 6px,

    .pixel-sprite,
    .pixel-ball {
      position: absolute;
      width: 12px;
      height: 12px;
      image-rendering: pixelated;
      transform: translate(-50%, -50%);
    }

    .pixel-sprite::before,
    .pixel-ball::before {
      content: "";
      position: absolute;
      inset: 0;
      box-shadow:
        0 0 0 2px currentColor inset,
        2px 2px 0 rgba(0, 0, 0, 0.24);
    }

    }

    .pixel-sprite.keeper {

      height: 13px;
      color: #ff7c66;
    }

    .pixel-ball {
      width: 8px;
      height: 8px;
      color: #ffffff;
      z-index: 4;
    }

    .pixel-ball::before {
      box-shadow:
        0 0 0 2px #ffffff inset,
        2px 2px 0 rgba(0, 0, 0, 0.2);
    }

    .pixel-sprite.a1 { top: 28%; left: 14%; }
    .pixel-sprite.a2 { top: 44%; left: 24%; }
    .pixel-sprite.a3 { top: 64%; left: 18%; }
    .pixel-sprite.a4 { top: 58%; left: 42%; }
    .pixel-sprite.a5 { top: 34%; left: 56%; }
    .pixel-sprite.b1 { top: 36%; left: 72%; }
    .pixel-sprite.b2 { top: 58%; left: 76%; }
    .pixel-sprite.b3 { top: 44%; left: 86%; }
    .pixel-sprite.goal-left { top: 50%; left: 7%; }
    .pixel-sprite.goal-right { top: 50%; left: 93%; }

    .pixel-match-stage.scene-corner .pixel-ball {
      top: 19%;
      left: 8%;
      animation: pixel-ball-corner 2.6s steps(6) infinite;
    }

    .pixel-match-stage.scene-corner .pixel-sprite.a1 {
      animation: pixel-run-box 2.1s steps(4) infinite;
    }

    .pixel-match-stage.scene-corner .pixel-sprite.a5,
    .pixel-match-stage.scene-corner .pixel-sprite.b1 {
      animation: pixel-jostle 1.1s steps(2) infinite;
    }

    .pixel-match-stage.scene-fatigue .pixel-ball {
      top: 49%;
      left: 46%;
      animation: pixel-ball-stall 2.4s steps(4) infinite;
    }

    .pixel-match-stage.scene-fatigue .pixel-sprite.a2,
    .pixel-match-stage.scene-fatigue .pixel-sprite.a3,
    .pixel-match-stage.scene-fatigue .pixel-sprite.a4 {
      animation: pixel-slow-drift 2.8s steps(4) infinite;
    }

    .pixel-match-stage.scene-fatigue .pixel-sprite.b1,
    .pixel-match-stage.scene-fatigue .pixel-sprite.b2 {
      animation: pixel-pressing 1.6s steps(3) infinite;
    }

    .pixel-match-stage.scene-late .pixel-ball {

    function rand(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function pick(arr) {
      return arr[rand(0, arr.length - 1)];
    }

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));

    function lerp(start, end, amount) {
      return start + (end - start) * amount;

    function easeInOutQuad(value) {
      return value < 0.5 ? 2 * value * value : 1 - Math.pow(-2 * value + 2, 2) / 2;

        return render();
      }
      adjustResources({
        money: -item.price,
        items: { [item.id]: item.add || 1 }
      });
      trackFeedbackEvent("buy_item", { itemId: item.id, price: item.price, moneyAfter: state.resources.money });
      addNews("商店采购", item.title, `花了 ${item.price} 点赞助金，把这件“${item.title}”塞进了仓库。${item.note}`);
      state.shopStock = state.shopStock.filter((entry) => entry.id !== id);
      render();

    function adjustResources(delta) {
      if (!delta) return;
      if (delta.points) state.resources.points += delta.points;
      if (delta.morale) state.resources.morale = clamp(state.resources.morale + delta.morale, 10, 100);
      if (delta.tactics) state.resources.tactics = clamp(state.resources.tactics + delta.tactics, 10, 100);
      if (delta.fitness) state.resources.fitness = clamp(state.resources.fitness + delta.fitness, 10, 100);
      if (delta.trust) state.resources.trust = clamp(state.resources.trust + delta.trust, 10, 100);
      if (delta.pressure) state.resources.pressure = clamp(state.resources.pressure + delta.pressure, 0, 100);
      if (delta.money) state.resources.money = Math.max(0, state.resources.money + delta.money);
      if (delta.items) {
        Object.entries(delta.items).forEach(([key, value]) => {
          state.resources.items[key] = Math.max(0, (state.resources.items[key] || 0) + value);
        });
      }
    }

    function compareTableRows(a, b) {
      if (b.pts !== a.pts) return b.pts - a.pts;

    function buildBestThirdTable(meTeam) {
      const thirdTeams = [];
      for (let i = 0; i < 11; i += 1) {
        const pts = rand(2, 6);
        const gd = rand(-3, 3);
        const gf = clamp(pts + rand(0, 4) + gd, 0, 9);
        thirdTeams.push({
          name: `第 ${i + 1} 组第三`,
          pts,
          gd,
          gf,
          me: false
        });
      }
      thirdTeams.push({
        name: "中国",
        pts: meTeam.pts,
        gd: meTeam.gd,
        gf: meTeam.gf,
        me: true
      });
      return thirdTeams.sort(compareTableRows);

      }

      if (state.phase === "prep") {
        if (state.week < 2) {
          state.week += 1;
          return enterStrategyRound();
        }

        state.phase = "qualifiers";
        return enterStrategyRound();
      }

      if (state.phase === "qualifiers") {
        if (state.qualifiers.index >= state.qualifiers.fixtures.length) {
          if (state.qualifiers.points >= state.qualifiers.directThreshold) {
            return enterWorldCup("direct");
          }

          if (state.qualifiers.points >= state.qualifiers.playoffThreshold) {
            state.qualifiers.playoffStage = "asian";
            state.roundData = {
              type: "qualifier-playoff",
              stage: "asian",
              opponent: { ...QUALIFIER_PLAYOFFS.asian }
            };
            state.view = "playoff";
            return render();
          }

          return endGame("火车站战神");
        }

        return enterStrategyRound();
      }

      if (state.phase === "worldcup") {
        if (state.view === "wc-draw") {
          return enterStrategyRound();
        }
        if (state.worldCup.round >= state.worldCup.schedule.length) {
          const rank = getWorldCupRanking().findIndex((team) => team.me) + 1;
          if (rank <= 2) {
            state.worldCup.groupProgress = { mode: "top2", rank };
            state.groupContinueOffered = true;
            state.view = "group-qualified";
            return render();
          }
          if (rank === 3) {
            const me = getWorldCupRanking().find((team) => team.me);
            const thirdPlaceTable = buildBestThirdTable(me);
            const thirdRank = thirdPlaceTable.findIndex((team) => team.me) + 1;
            state.worldCup.thirdPlaceTable = thirdPlaceTable;
            if (thirdRank <= 8) {
              state.worldCup.groupProgress = { mode: "best-third", rank, thirdRank };
              state.groupContinueOffered = true;
              state.view = "group-qualified";
              addNews("出线形势", "最好第三名抢到了", `中国队以所有小组第三中的第 ${thirdRank} 名挤进了 32 强。计算器这次真立功了。`);
              return render();
            }
            state.worldCup.groupProgress = { mode: "best-third-out", rank, thirdRank };
          }
          return endGame("虽败犹荣");
        }

        return enterStrategyRound();
      }

      if (state.phase === "knockout") {
        if (state.knockout.round >= state.knockout.fixtures.length) {
          return endGame("世界之巅");
        }

        return enterStrategyRound();
      }
    }

    function getRoundObjective() {
      if (state.view === "result" && state.matchFlow?.result) {
        const result = state.matchFlow.result;
        if (state.phase === "qualifiers") {
          const title = state.roundData?.type === "qualifier-playoff"
            ? `${state.roundData?.opponent?.stageLabel || "附加赛"} · 对阵 ${result.opponent}`
            : `预选赛第 ${Math.max(state.qualifiers?.index || 1, 1)} 场 · 对阵 ${result.opponent}`;
          return {
            title,
            text: "比赛已经踢完了，先看赛后风向，再决定下一步往哪走。"
          };
        }
        if (state.phase === "worldcup") {
          return {
            title: `世界杯小组赛第 ${Math.max(state.worldCup?.round || 1, 1)} 场 · 对阵 ${result.opponent}`,
            text: "终场哨已经响了，现在先看结果和积分形势怎么变。"
          };
        }
        if (state.phase === "knockout") {
          const finishedFixture = state.knockout?.fixtures?.[Math.max((state.knockout?.round || 1) - 1, 0)];
          return {
            title: `${finishedFixture?.title || "淘汰赛"} · 对阵 ${result.opponent}`,
            text: "淘汰赛没有回头路，先确认你是继续做梦，还是就此下线。"
          };
        }
      }

      if (state.phase === "prep") {
        return {
          title: `备战周 ${state.week}`,
          text: state.week === 1
            ? "先把球队气质立住。现在最怕的不是输，是还没开踢就先散。"
            : "第二轮备战要开始定调：你是想更稳，还是为后面留一个上限？"
        };
      }

      if (state.phase === "qualifiers") {
        const opponent = getCurrentOpponent();
        return {
          title: `${opponent?.stageLabel || `预选赛第 ${(state.qualifiers?.index || 0) + 1} 场`} · 对阵 ${opponent?.name || "待定对手"}`,
          text: opponent?.flavor || "这一轮的对手信息还没完全落位，先准备好下一步。"
        };
      }

      if (state.phase === "worldcup") {
        if (state.view === "wc-draw") {
          const names = state.worldCup.teams.slice(1).map((team) => team.name).join(" / ");
          return {
            title: "世界杯抽签结果",
            text: `中国队被分入一个四队小组，对手分别是 ${names}。目标很明确：前二直接出线，实在不行也得抢最好第三名。`
          };
        }
        const opponent = getCurrentOpponent();
        const round = state.worldCup.round + 1;
        let text = `你将面对 ${opponent?.name || "待定对手"}。`;
        if (round === 3) {
          text += " 打平未必够，最好别把命运全交给另一块记分牌和最好第三名的比较线。";
        } else if (round === 1) {
          text += " 第一场很关键，至少别让自己直接进入“理论出线”。";
        } else {
          text += " 现在大家都开始盯积分榜了，别让计算器比球先热。";
        }
        return {
          title: `世界杯小组赛第 ${round} 场 · 对阵 ${opponent?.name || "待定对手"}`,
          text
        };
      }

      if (state.phase === "knockout") {
        const fixture = getCurrentOpponent();
        return {
          title: `${fixture?.title || "淘汰赛"} · 对阵 ${fixture?.name || "待定对手"}`,
          text: "从这里开始，每一场都必须分出胜负。90 分钟解决不了，就去加时和点球里赌命。"
        };
      }

      return {
        title: "上任风暴",
        text: "先选风格，再选赞助商。反正舆论迟早要来，区别只是怎么来。"
      };
    }

    function getWarnings() {
      if (!state.resources) {
        return [];
      }
      const warnings = [];
      if (state.resources.fitness <= 40) {
        warnings.push("球队连续高强度作战，最后 20 分钟极易崩盘。");
      }
      if (state.resources.pressure >= 65) {
        warnings.push("舆论压力已经很高，再输一场将触发下课风暴。");
      }
      if (state.phase === "qualifiers") {
        const matchesLeft = state.qualifiers.fixtures.length - state.qualifiers.index;
        if (matchesLeft <= 1 && state.qualifiers.points < state.qualifiers.directThreshold) {
          warnings.push("后面不胜基本要进附加赛剧本了。");
        }
      }
      if (state.phase === "worldcup" && state.worldCup.round === 2) {
        warnings.push("第三轮前大家都开始算分了，前二和最好第三名两条线都得盯着。");
      }
      return warnings;
    }

    function getMatchSceneDuration(scene) {
      if (scene === "corner") return 4.6;
      if (scene === "fatigue") return 5.1;
      return 4.8;
    }

    function quadraticPoint(start, control, end, t) {
      const oneMinus = 1 - t;
      return {
        x: oneMinus * oneMinus * start.x + 2 * oneMinus * t * control.x + t * t * end.x,
        y: oneMinus * oneMinus * start.y + 2 * oneMinus * t * control.y + t * t * end.y
      };
    }

    function projectileHeight(progress, peak) {
      return 4 * peak * progress * (1 - progress);
    }

    function projectilePoint(start, end, progress, peak) {
      const eased = easeInOutQuad(progress);
      return {
        x: lerp(start.x, end.x, eased),
        y: lerp(start.y, end.y, eased),
        z: projectileHeight(progress, peak)
      };
    }

    function getBallFootPosition(player, elapsed, side = 1) {
      const facing = player.facing || 0;
      const forwardX = Math.cos(facing);
      const forwardY = Math.sin(facing);
      const sideX = -forwardY;
      const sideY = forwardX;
      const dribble = Math.sin(elapsed * 11 + player.seed * 10);
      return {
        x: player.x + forwardX * 1 + sideX * (side * 9 + dribble * 2.5),
        y: player.y + 64 + forwardY * 3 + sideY * (side * 2.6 + dribble * 0.8),
        z: 0,
        spin: elapsed * 10 + dribble * 0.8
      };
    }

    function rollingBallPoint(start, end, progress, spinBase = 0) {
      const eased = easeInOutQuad(progress);
      return {
        x: lerp(start.x, end.x, eased),
        y: lerp(start.y, end.y, eased),
        z: 0,
        spin: spinBase + eased * 18
      };
    }

    function convergeValue(start, end, progress, lag = 0) {
      const p = clamp((progress - lag) / Math.max(0.0001, 1 - lag), 0, 1);
      return lerp(start, end, easeInOutQuad(p));
    }

    function getPlayerAppearance(player) {
      const index = Math.abs(Math.floor(player.seed * 1000)) % 12;
      const hairColors = ["#2a1c14", "#3d2719", "#201f2f", "#5a3b22", "#53261c", "#18263f", "#734b2d", "#101114", "#874e2a", "#40313e", "#0f3558", "#6a5b2e"];
      const skinTones = ["#ffd8b1", "#f1c79d", "#e3b489", "#d89d74", "#c98a66", "#b97858", "#8b5a3c", "#6b432f"];
      const hairStyles = ["crop", "messy", "parted", "spike", "buzz", "curl", "mohawk", "afro", "sidefade", "longtop", "crew", "wave"];
      const faceStyles = ["smirk", "grim", "open", "flat", "bite", "frown", "grit", "calm", "snarl", "wide", "tight", "beard"];
      const headScales = [0.96, 1, 1.04, 0.94, 1.08, 0.98, 1.02, 1.1, 0.95, 1.03, 0.97, 1.06];
      const bodyScales = [0.92, 0.98, 1.05, 0.9, 1.08, 1.02, 0.96, 1.1, 0.94, 1.03, 0.99, 1.06];
      const heightScales = [0.92, 0.97, 1, 1.05, 1.1, 0.95, 1.08, 1.14, 0.9, 1.03, 0.99, 1.07];
      return {
        hairColor: hairColors[index],
        skin: skinTones[(index + (player.team === "away" ? 2 : 0)) % skinTones.length],
        hairStyle: hairStyles[index],
        faceStyle: faceStyles[(index + (player.role === "keeper" ? 2 : 0)) % faceStyles.length],
        headScale: headScales[index],
        bodyScale: bodyScales[index],
        heightScale: heightScales[index],
        hasBeard: index === 5 || index === 11,
        browTilt: index % 4
      };
    }

    function buildMatchScene(meta, elapsed) {
      const world = { width: 1600, height: 900 };
      const t = (elapsed % getMatchSceneDuration(meta.scene)) / getMatchSceneDuration(meta.scene);
      const players = [];
      let ball = { x: 700, y: 450, z: 0 };
      let focus = { x: 700, y: 450, leadX: 120, leadY: 0 };
      let impact = { alpha: 0, x: 0, y: 0 };
      let trail = null;

      if (meta.scene === "corner") {
        const wingerRun = clamp(t / 0.34, 0, 1);
        const crossFlight = clamp((t - 0.34) / 0.34, 0, 1);
        const scramble = clamp((t - 0.68) / 0.32, 0, 1);
        const winger = {
          team: "home",
          role: "winger",
          x: lerp(220, 420, easeInOutQuad(wingerRun)),
          y: lerp(220, 150, easeInOutQuad(wingerRun)),
          facing: 0.2,
          action: t < 0.34 ? "dribble" : "follow",
          seed: 0.2
        };
        const striker = {
          team: "home",
          role: "striker",
          x: lerp(860, 1130, easeInOutQuad(clamp((t - 0.14) / 0.58, 0, 1))),
          y: lerp(470, 420, easeInOutQuad(clamp((t - 0.14) / 0.58, 0, 1))),
          facing: 0.18,
          action: t < 0.68 ? "run" : "battle",
          seed: 0.5
        };
        const bruiser = {
          team: "home",
          role: "bruiser",
          x: lerp(760, 1080, easeInOutQuad(clamp((t - 0.18) / 0.54, 0, 1))),
          y: lerp(580, 500, easeInOutQuad(clamp((t - 0.18) / 0.54, 0, 1))),
          facing: 0.15,
          action: t < 0.68 ? "run" : "battle",
          seed: 0.9
        };
        const d1 = {
          team: "away",
          role: "defender",
          x: lerp(520, 980, easeInOutQuad(clamp((t - 0.08) / 0.6, 0, 1))),
          y: lerp(250, 360, easeInOutQuad(clamp((t - 0.08) / 0.6, 0, 1))),
          facing: 3.1,
          action: t < 0.68 ? "hunt" : "battle",
          seed: 0.3
        };
        const d2 = {
          team: "away",
          role: "defender",
          x: lerp(1150, 1210, easeInOutQuad(clamp((t - 0.16) / 0.58, 0, 1))),
          y: lerp(520, 450, easeInOutQuad(clamp((t - 0.16) / 0.58, 0, 1))),
          facing: 3.08,
          action: t < 0.68 ? "track" : "battle",
          seed: 0.7
        };
        const d3 = {
          team: "away",
          role: "defender",
          x: lerp(980, 1110, easeInOutQuad(clamp((t - 0.2) / 0.52, 0, 1))),
          y: lerp(640, 520, easeInOutQuad(clamp((t - 0.2) / 0.52, 0, 1))),
          facing: 3.02,
          action: t < 0.68 ? "track" : "battle",
          seed: 1.1
        };
        const keeper = { team: "away", role: "keeper", x: 1490, y: 455, facing: 3.14, action: scramble > 0.45 ? "save" : "guard", seed: 0.4 };

        if (t >= 0.68) {
          const scrambleBall = rollingBallPoint({ x: 1180, y: 425 }, { x: 1320, y: 410 }, scramble, 12);
          striker.x = convergeValue(striker.x, scrambleBall.x - 36, scramble, 0.04);
          striker.y = convergeValue(striker.y, scrambleBall.y + 10, scramble, 0.04);
          bruiser.x = convergeValue(bruiser.x, scrambleBall.x - 24, scramble, 0.1);
          bruiser.y = convergeValue(bruiser.y, scrambleBall.y + 42, scramble, 0.1);
          d1.x = convergeValue(d1.x, scrambleBall.x - 8, scramble, 0.02);
          d1.y = convergeValue(d1.y, scrambleBall.y - 18, scramble, 0.02);

    function drawCanvasText(ctx, text, x, y, maxWidth, lineHeight, maxLines) {
      const chars = [...text];
      let line = "";
      let drawn = 0;
      for (let i = 0; i < chars.length; i += 1) {
        const test = line + chars[i];
        if (ctx.measureText(test).width > maxWidth && line) {
          ctx.fillText(line, x, y + drawn * lineHeight);
          drawn += 1;
          if (drawn >= maxLines) return;
          line = chars[i];
        } else {
          line = test;
        }
      }
      if (line && drawn < maxLines) {
        ctx.fillText(line, x, y + drawn * lineHeight);
      }
    }

    function projectMatchPoint(runtime, x, y, z = 0) {
      const width = runtime.size.width;
      const height = runtime.size.height;
      const scaleX = width / runtime.view.width;
      const scaleY = height / runtime.view.height;
      const sx = (x - runtime.camera.x) * scaleX + width / 2;
      const scale = 0.76 + (y / runtime.world.height) * 0.48;
      const sy = (y - runtime.camera.y) * scaleY * 0.78 + height * 0.58 + ((y / runtime.world.height) - 0.5) * height * 0.1 - z * (1.08 + scale * 0.28);
      return { x: sx, y: sy, scale };
    }

    function drawMatchPitch(runtime, snapshot, meta, elapsed) {
      const { ctx } = runtime;
      const width = runtime.size.width;
      const height = runtime.size.height;
      const fieldTop = 28;
      const fieldBottom = height - 26;
      ctx.fillStyle = "#09111d";
      ctx.fillRect(0, 0, width, height);

      const crowdShift = (elapsed * 130) % 28;
      for (let row = 0; row < 4; row += 1) {
        const rowY = 10 + row * 10;
        for (let i = 0; i < 44; i += 1) {
          const px = (i * 28 + crowdShift * (row % 2 === 0 ? 1 : -0.7)) % (width + 48) - 24;
          ctx.fillStyle = i % 3 === 0 ? "#ffcb6a" : i % 3 === 1 ? "#ff7456" : "#7ea0ff";
          ctx.fillRect(px, rowY, 10, 6);
          ctx.fillStyle = "rgba(12,16,28,0.9)";
          ctx.fillRect(px, rowY + 6, 10, 3);
        }
      }

      for (let i = 0; i < 16; i += 1) {
        const adX = (i * (width / 8)) % (width + 180) - 90;
        const adColor = i % 4 === 0 ? "#f7c14b" : i % 4 === 1 ? "#ff6c5c" : i % 4 === 2 ? "#59d48b" : "#7da7ff";
        ctx.fillStyle = "rgba(10, 14, 22, 0.84)";
        ctx.fillRect(adX, fieldBottom - 18, 92, 18);
        ctx.fillStyle = adColor;
        ctx.fillRect(adX + 2, fieldBottom - 16, 88, 14);
      }

      for (let i = 0; i < 18; i += 1) {
        const px = (i * 92 + (snapshot.t * 80)) % (width + 120) - 60;
        ctx.fillStyle = "rgba(255,255,255,0.08)";
        ctx.fillRect(px, fieldTop + 6, 48, 4);
        ctx.fillRect(px + 12, fieldTop + 12, 24, 3);
      }

      const fieldLeft = projectMatchPoint(runtime, 0, 0).x;
      const fieldRight = projectMatchPoint(runtime, snapshot.world.width, 0).x;
      const fieldY1 = projectMatchPoint(runtime, 0, 0).y;
      const fieldY2 = projectMatchPoint(runtime, 0, snapshot.world.height).y;

      ctx.fillStyle = "#123520";
      ctx.fillRect(fieldLeft, Math.min(fieldY1, fieldY2) - 34, fieldRight - fieldLeft, Math.abs(fieldY2 - fieldY1) + 68);

      for (let stripe = 0; stripe < 12; stripe += 1) {
        const start = projectMatchPoint(runtime, stripe * (snapshot.world.width / 12), 0).x;
        const end = projectMatchPoint(runtime, (stripe + 1) * (snapshot.world.width / 12), 0).x;
        ctx.fillStyle = stripe % 2 === 0 ? "#24884e" : "#1c7441";
        ctx.fillRect(start, fieldTop, end - start + 2, fieldBottom - fieldTop);
      }

      ctx.save();
      ctx.strokeStyle = "rgba(244,248,255,0.78)";
      ctx.lineWidth = 3;
      ctx.strokeRect(fieldLeft + 2, fieldTop + 2, fieldRight - fieldLeft - 4, fieldBottom - fieldTop - 4);
      const midX = projectMatchPoint(runtime, snapshot.world.width / 2, 0).x;
      ctx.beginPath();
      ctx.moveTo(midX, fieldTop);
      ctx.lineTo(midX, fieldBottom);
      ctx.stroke();

      const center = projectMatchPoint(runtime, snapshot.world.width / 2, snapshot.world.height / 2);
      ctx.beginPath();
      ctx.ellipse(center.x, center.y, 42, 32, 0, 0, Math.PI * 2);
      ctx.stroke();

      const leftBox = projectMatchPoint(runtime, 0, snapshot.world.height * 0.25);
      const leftBoxBottom = projectMatchPoint(runtime, 180, snapshot.world.height * 0.75);
      ctx.strokeRect(fieldLeft + 2, leftBox.y, leftBoxBottom.x - fieldLeft - 4, leftBoxBottom.y - leftBox.y);

      const rightBox = projectMatchPoint(runtime, snapshot.world.width - 180, snapshot.world.height * 0.25);
      const rightBoxBottom = projectMatchPoint(runtime, snapshot.world.width, snapshot.world.height * 0.75);
      ctx.strokeRect(rightBox.x, rightBox.y, fieldRight - rightBox.x - 2, rightBoxBottom.y - rightBox.y);
      ctx.restore();

      ctx.fillStyle = "rgba(255,255,255,0.04)";
      for (let i = 0; i < 32; i += 1) {
        ctx.fillRect(0, ((elapsed * 120) + i * 18) % height, width, 1);
      }

    }

    function drawMatchTrail(runtime, trail) {
      if (!trail) return;
      const { ctx } = runtime;
      ctx.save();
      ctx.strokeStyle = `rgba(255, 240, 185, ${trail.alpha})`;
      ctx.lineWidth = 6;
      ctx.lineCap = "round";
      ctx.beginPath();
      trail.points.forEach((point, index) => {
        const projected = projectMatchPoint(runtime, point.x, point.y, point.z || 0);
        if (index === 0) ctx.moveTo(projected.x, projected.y);
        else ctx.lineTo(projected.x, projected.y);
      });
      ctx.stroke();
      ctx.restore();
    }

    function drawMatchPlayer(runtime, player, elapsed, hasBall) {

      const actionIntensity = player.action === "battle" || player.action === "hunt"

      const legSwing = player.action === "guard" ? 0 : runPhase * 4 * actionIntensity;
      const armSwing = Math.sin(elapsed * 11 + player.seed * 5) * 4 * actionIntensity;

        ctx.fillRect(-1.4, -5.6, 2.8, 0.8);
        ctx.fillStyle = "#1e1713";
        ctx.fillRect(-2.6, -4.9, 5.2, 2.3);
      } else {
        ctx.fillRect(-1.6, -5.8, 3.2, 0.9);
      }
      if (player.action === "battle" || player.action === "hunt") {
        ctx.strokeStyle = "rgba(255,255,255,0.32)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(-11, -2);
        ctx.lineTo(-18, -5);
        ctx.moveTo(11, 0);
        ctx.lineTo(18, -3);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawMatchBall(runtime, ball) {
      const { ctx } = runtime;
      const shadow = projectMatchPoint(runtime, ball.x, ball.y);
      const spin = ball.spin || 0;
      ctx.save();
      ctx.fillStyle = "rgba(0,0,0,0.24)";
      ctx.beginPath();
      ctx.ellipse(shadow.x, shadow.y + 8, 8 * shadow.scale, 4 * shadow.scale, 0, 0, Math.PI * 2);
      ctx.fill();

      const projected = projectMatchPoint(runtime, ball.x, ball.y, ball.z);
      const radius = 5.5 * projected.scale;
      ctx.translate(projected.x, projected.y);
      ctx.rotate(spin);
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#182231";
      ctx.lineWidth = 1.1 * projected.scale;
      ctx.beginPath();
      ctx.arc(0, 0, radius * 0.42, 0, Math.PI * 2);
      ctx.moveTo(-radius * 0.78, 0);
      ctx.lineTo(radius * 0.78, 0);
      ctx.moveTo(0, -radius * 0.78);
      ctx.lineTo(0, radius * 0.78);
      ctx.stroke();
      ctx.fillStyle = "#182231";
      ctx.beginPath();
      ctx.arc(-radius * 0.44, -radius * 0.22, radius * 0.18, 0, Math.PI * 2);
      ctx.arc(radius * 0.44, radius * 0.2, radius * 0.16, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,0.22)";
      ctx.lineWidth = 1.4;
      ctx.stroke();
      ctx.restore();
    }

    function drawMatchImpact(runtime, meta, impact) {
      if (!impact.alpha) return;
      const { ctx } = runtime;
      const projected = projectMatchPoint(runtime, impact.x, impact.y);
      ctx.save();
      ctx.globalAlpha = impact.alpha;
      ctx.strokeStyle = "rgba(255, 224, 133, 0.95)";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(projected.x, projected.y, 28, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    function resizeMatchCanvasPrototype() {
      if (!matchCanvasRuntime?.canvas) return;
      const rect = matchCanvasRuntime.canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      matchCanvasRuntime.canvas.width = Math.round(rect.width * dpr);
      matchCanvasRuntime.canvas.height = Math.round(rect.height * dpr);
      matchCanvasRuntime.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      matchCanvasRuntime.size = {
        width: rect.width,
        height: rect.height,
        dpr
      };
    }

    function destroyMatchCanvasPrototype() {
      if (!matchCanvasRuntime) return;
      if (matchCanvasRuntime.raf) {
        cancelAnimationFrame(matchCanvasRuntime.raf);
      }
      matchCanvasRuntime = null;
    }

    function drawMatchCanvasFrame(runtime, now) {
      const elapsed = (now - runtime.startedAt) / 1000;
      const dt = Math.min(0.05, (now - runtime.lastFrameAt) / 1000 || 0.016);
      runtime.lastFrameAt = now;
      const snapshot = buildMatchScene(runtime.meta, elapsed);
      runtime.world = snapshot.world;

      const cameraEase = 1 - Math.exp(-dt * 4.6);
      const cameraTargetX = clamp(snapshot.focus.x + snapshot.focus.leadX, runtime.view.width / 2, snapshot.world.width - runtime.view.width / 2);
      const cameraTargetY = clamp(snapshot.focus.y + snapshot.focus.leadY, runtime.view.height / 2, snapshot.world.height - runtime.view.height / 2);
      runtime.camera.x = lerp(runtime.camera.x, cameraTargetX, cameraEase);
      runtime.camera.y = lerp(runtime.camera.y, cameraTargetY, cameraEase);

      const { ctx, size } = runtime;
      ctx.clearRect(0, 0, size.width, size.height);
      drawMatchPitch(runtime, snapshot, runtime.meta, elapsed);
      drawMatchTrail(runtime, snapshot.trail);
      const groundedBall = snapshot.ball.z < 1.2;
      if (groundedBall) {
        drawMatchBall(runtime, snapshot.ball);
      }
      snapshot.players
        .slice()
        .sort((a, b) => a.y - b.y)
        .forEach((player) => {
          const hasBall = Math.abs(player.x - snapshot.ball.x) < 18 && Math.abs(player.y - snapshot.ball.y) < 16 && snapshot.ball.z < 2;
          drawMatchPlayer(runtime, player, elapsed, hasBall);
        });
      if (!groundedBall) {
        drawMatchBall(runtime, snapshot.ball);
      }
      drawMatchImpact(runtime, runtime.meta, snapshot.impact);

      runtime.raf = requestAnimationFrame((frameNow) => drawMatchCanvasFrame(runtime, frameNow));
    }

    function initMatchCanvasPrototype(canvas, meta) {
      const ctx = canvas.getContext("2d");
      if (!ctx) return;
      const startedAt = performance.now();
      matchCanvasRuntime = {
        canvas,
        ctx,
        meta,
        startedAt,
        lastFrameAt: startedAt,
        raf: 0,
        size: { width: 0, height: 0, dpr: 1 },
        world: { width: 1600, height: 900 },
        view: { width: 760, height: 500 },
        camera: { x: 760, y: 450 }
      };
      resizeMatchCanvasPrototype();
      drawMatchCanvasFrame(matchCanvasRuntime, startedAt);
    }

    function syncMatchCanvasPrototype() {
      const canvas = $("#matchCanvasStage");
      if (!canvas || state.view !== "match-choice") {
        destroyMatchCanvasPrototype();
        return;
      }
      const currentStep = state.matchFlow?.prompts?.[state.matchFlow?.step ?? 0];
      const meta = getCanvasMatchMeta(currentStep);
      if (!matchCanvasRuntime || matchCanvasRuntime.canvas !== canvas) {
        destroyMatchCanvasPrototype();
        initMatchCanvasPrototype(canvas, meta);
        return;
      }
      matchCanvasRuntime.meta = meta;
      resizeMatchCanvasPrototype();
    }

    function schedulePanelScale() {
      if (panelScaleRaf) cancelAnimationFrame(panelScaleRaf);
      panelScaleRaf = requestAnimationFrame(() => {
        panelScaleRaf = requestAnimationFrame(() => {
          panelScaleRaf = 0;
          fitPanelScale();
        });
      });
    }

    function bindPanelScaleObserver() {
      if (panelScaleObserver) {
        panelScaleObserver.disconnect();
        panelScaleObserver = null;
      }
      const panelBody = $("#panelBody");
      const frame = panelBody?.querySelector(".panel-scale-frame");
      const inner = panelBody?.querySelector(".panel-scale-inner");
      if (!panelBody || !frame || !inner || typeof ResizeObserver === "undefined") return;
      panelScaleObserver = new ResizeObserver(() => schedulePanelScale());
      panelScaleObserver.observe(panelBody);
      panelScaleObserver.observe(frame);
      panelScaleObserver.observe(inner);
    }

    function fitPanelScale() {
      const panelBody = $("#panelBody");
      const frame = panelBody?.querySelector(".panel-scale-frame");
      const inner = panelBody?.querySelector(".panel-scale-inner");
      if (!panelBody || !frame || !inner) return;

      /* mobile: native size, no scale transform */
      if (window.innerWidth <= 720) {
        panelBody.style.setProperty("--panel-scale", "1");
        panelBody.dataset.scaleActive = "false";
        panelBody.dataset.scaleTier = "normal";
        inner.style.width = "100%";
        return;
      }

      const measurePanelScale = () => {
        const frameRect = frame.getBoundingClientRect();
        const availableWidth = frameRect.width;
        const availableHeight = frameRect.height;
        if (!availableWidth || !availableHeight) return 1;

        const innerRect = inner.getBoundingClientRect();
        const contentWidth = Math.max(inner.scrollWidth, innerRect.width, inner.offsetWidth, 1);
        const contentHeight = Math.max(inner.scrollHeight, innerRect.height, inner.offsetHeight, 1);
        const nextScale = Math.min(1, availableWidth / contentWidth, availableHeight / contentHeight);
        return Number.isFinite(nextScale) && nextScale > 0 ? nextScale : 1;
      };

      panelBody.style.setProperty("--panel-scale", "1");
      panelBody.dataset.scaleActive = "false";
      panelBody.dataset.scaleTier = "normal";
      inner.style.width = "100%";

      let safeScale = measurePanelScale();
      if (panelBody.dataset.view === "round" || panelBody.dataset.view === "match-setup" || panelBody.dataset.view === "match-choice") {
        if (panelBody.dataset.view === "round") {
          if (safeScale < 0.82) {
            panelBody.dataset.scaleTier = "tight";
          } else if (safeScale < 0.94) {
            panelBody.dataset.scaleTier = "compact";
          }
        } else if (safeScale < 0.8) {
          panelBody.dataset.scaleTier = "tight";
        } else if (safeScale < 0.9) {
          panelBody.dataset.scaleTier = "compact";
        }
        safeScale = measurePanelScale();
      }

      panelBody.style.setProperty("--panel-scale", safeScale.toFixed(4));
      panelBody.dataset.scaleActive = safeScale < 0.999 ? "true" : "false";
      inner.style.width = safeScale < 0.999 ? `${(100 / safeScale).toFixed(4)}%` : "100%";
    }

    function setPanelBodyContent(markup) {

    function pickStrategy(id) {
      const strategy = STRATEGIES.find((item) => item.id === id);
      state.selectedStrategy = strategy;
      adjustResources(strategy.effect);
      trackFeedbackEvent("pick_strategy", {
        strategyId: strategy.id,
        phase: state.phase,
        pressure: state.resources.pressure,
        fitness: state.resources.fitness
      });

      addNews(
        "周内决策",
        strategy.title,
        `${strategy.text} ${strategy.tag}`
      );

      if (Math.random() < 0.45) {
        state.pendingEvent = pick(EVENTS);
        state.view = "event";
      } else {
        afterWeeklyDecision();
      }
      render();
    }

    function afterWeeklyDecision() {
      if (state.phase === "prep") {
        state.view = "prep-result";
        state.roundData = {
          summary: `这一周的调整已经生效。队里还没完全像一个整体，但至少不像刚接电话时那么散了。当前舆论 ${state.resources.pressure}，体能 ${state.resources.fitness}，更衣室信任 ${state.resources.trust}。`
        };
        return;

      state.view = "match-setup";

      const option = state.pendingEvent.options[Number(index)];
      adjustResources(option.effect);
      addNews("突发事件", state.pendingEvent.title, option.desc);
      state.pendingEvent = null;
      afterWeeklyDecision();
      render();

    function startMatch() {
      const tactic = $("input[name='tactic']:checked")?.value || "balanced";
      const attitude = $("input[name='attitude']:checked")?.value || "normal";
      const item = $("input[name='item']:checked")?.value || "none";
      const promptCount = state.phase === "knockout" ? 5 : rand(4, 5);
      const prompts = shuffle(MATCH_PROMPT_POOL).slice(0, promptCount);
      state.selectedMatchConfig = { tactic, attitude, item };
      state.matchFlow = {
        step: 0,
        prompts,
        mods: { win: 0, draw: 0, defense: 0, concede: 0, penalty: 0 },
        videoClips: buildMatchVideoClips(),
        result: null
      };
      applyMatchItem(item);
      trackFeedbackEvent("start_match", {
        phase: state.phase,
        tactic,
        attitude,
        item,
        opponent: getCurrentOpponent()?.name || "unknown"
      });
      state.view = "match-choice";
      render();
    }

    function matchChoice(index) {
      const current = state.matchFlow?.prompts?.[state.matchFlow?.step ?? 0];
      if (!current || !Array.isArray(current.options)) {
        if (state.matchFlow?.result) {
          state.view = "result";
          return render();
        }
        return;
      }
      const option = current.options[Number(index)];
      if (!option) return;
      const effect = option.effect;
      if (effect.win) state.matchFlow.mods.win += effect.win;
      if (effect.draw) state.matchFlow.mods.draw += effect.draw;
      if (effect.defense) state.matchFlow.mods.defense += effect.defense;
      if (effect.concede) state.matchFlow.mods.concede += effect.concede;
      if (effect.penalty) state.matchFlow.mods.penalty += effect.penalty;
      adjustResources({
        fitness: effect.fitness || 0,
        trust: effect.trust || 0,
        morale: effect.morale || 0,
        pressure: effect.pressure || 0,
        tactics: effect.tactics || 0
      });

      state.matchFlow.step += 1;
      if (state.matchFlow.step >= state.matchFlow.prompts.length) {
        resolveMatch();
      } else {
        render();
      }
    }

    function tacticMods(tactic) {
      if (tactic === "defend") return { win: -4, draw: 12, fitness: 3, defense: 8 };
      if (tactic === "press") return { win: 8, draw: -2, fitness: -8, defense: -2 };
      if (tactic === "allin") return { win: 12, draw: -6, fitness: -12, defense: -6 };
      return { win: 2, draw: 2, fitness: -2, defense: 2 };
    }

    function attitudeMods(attitude) {
      if (attitude === "safe") return { win: -3, draw: 10, pressure: -2 };
      if (attitude === "must") return { win: 7, draw: -5, pressure: 4 };
      return { win: 2, draw: 1 };
    }

    function resolveMatch() {
      const opponent = getCurrentOpponent();
      const isQualifierPlayoff = state.phase === "qualifiers" && state.roundData?.type === "qualifier-playoff";
      const isEliminationMatch = state.phase === "knockout" || isQualifierPlayoff;
      const tactic = tacticMods(state.selectedMatchConfig.tactic);
      const attitude = attitudeMods(state.selectedMatchConfig.attitude);
      adjustResources({ fitness: tactic.fitness || 0, pressure: attitude.pressure || 0 });

      const coachMods = state.coach?.mods || {};
      let winChance = opponent.baseChance
        + (state.resources.morale - 70) * 0.22
        + (state.resources.tactics - 50) * 0.24
        + (state.resources.fitness - 80) * 0.18
        + (state.resources.trust - 60) * 0.16
        - state.resources.pressure * 0.22
        + (coachMods.win || 0)
        + (coachMods.draw ? 0 : 0)
        + tactic.win
        + attitude.win
        + state.matchFlow.mods.win;

      let drawRate = 22 + (coachMods.draw || 0) + tactic.draw + attitude.draw + state.matchFlow.mods.draw;
      const concedeRisk = state.matchFlow.mods.concede - (state.matchFlow.mods.defense || 0);

      winChance = clamp(winChance, 8, 88);
      drawRate = clamp(drawRate, 8, 42);

      const roll = Math.random() * 100;
      let outcome = "loss";
      if (roll < winChance) {
        outcome = "win";
      } else if (roll < winChance + drawRate) {
        outcome = "draw";
      }

      const score = buildScore(outcome, state.selectedMatchConfig.tactic, winChance, concedeRisk);
      const reasons = buildReasons(outcome, tactic, attitude, concedeRisk);
      let penaltyNote = "";

      if (isEliminationMatch && outcome === "draw") {
        const penWinRate = clamp(
          50
          + (state.resources.trust - 60) * 0.2
          + (state.selectedMatchConfig.tactic === "defend" ? 4 : 0)
          + (state.selectedMatchConfig.attitude === "must" ? 2 : 0),
          35,
          68
        ) + (state.matchFlow.mods.penalty || 0);
        const finalPenWinRate = clamp(
          penWinRate,
          35,
          68
        );
        const penRoll = rand(1, 100);
        if (penRoll <= finalPenWinRate) {
          outcome = "win";
          penaltyNote = `90 分钟 ${score[0]}:${score[1]}，点球大战险胜。`;
          reasons.unshift("常规时间没分出胜负，但你把比赛拖进了点球并撑住了最后一口气。");
        } else {
          outcome = "loss";
          penaltyNote = `90 分钟 ${score[0]}:${score[1]}，点球大战倒下。`;
          reasons.unshift("常规时间扛住了，但最后还是在点球线上把命丢了。");
        }
      }

      if (outcome === "win") {
        adjustResources({ points: 3, morale: 10, trust: 5, pressure: -8, money: 2 });
      } else if (outcome === "draw") {
        adjustResources({ points: 1, morale: 3, pressure: -2 });
      } else {
        adjustResources({ morale: -8, trust: -3, pressure: 10 });
        if (state.selectedStrategy?.effect?.tempPressureOnLoss) {
          adjustResources({ pressure: state.selectedStrategy.effect.tempPressureOnLoss });
        }
      }

      if (isQualifierPlayoff) {
        if (outcome === "win" && state.roundData.stage === "asian") {
          state.qualifiers.playoffStage = "intercontinental";
          state.roundData = {
            type: "qualifier-playoff",
            stage: "intercontinental",
            opponent: { ...QUALIFIER_PLAYOFFS.intercontinental }
          };
          state.view = "playoff";
          addNews("附加赛", "亚洲附加赛惊险过关", "你先从亚洲附加赛里爬出来了，但最后还得去洲际附加赛拼门票。");
          return render();
        }
        if (outcome === "win" && state.roundData.stage === "intercontinental") {
          state.qualifiers.playoffStage = "qualified";
          return enterWorldCup("playoff");
        }
        return endGame("熟悉的附加赛");
      }

      if (state.phase === "qualifiers") {
        state.qualifiers.points += outcome === "win" ? 3 : outcome === "draw" ? 1 : 0;
        state.qualifiers.index += 1;
      } else if (state.phase === "worldcup") {
        applyWorldCupResult(outcome, score, opponent.name);
        state.worldCup.round += 1;
      } else if (state.phase === "knockout") {
        if (outcome === "loss") {
          const exitRound = state.knockout.round;
          state.knockout.round += 1;
          return endGame(exitRound >= 3 ? "四强狂想曲" : "创造历史");
        }
        state.knockout.round += 1;
      }

      const reaction = getPostMatchReaction(outcome, score, penaltyNote);
      const { headline, fan, pundit, pressQuote } = reaction;
      addNews("赛后头条", headline, `${fan} ${pundit} ${pressQuote}`);
      trackFeedbackEvent("match_result", {
        phase: state.phase,
        outcome,
        score: `${score[0]}:${score[1]}`,
        penalty: penaltyNote || null,
        opponent: opponent.name
      });

      state.matchFlow.result = {
        outcome,
        opponent: opponent.name,
        score,
        headline,
        fan,
        pundit,
        pressQuote,
        reasons,
        penaltyNote,
        flavor: outcome === "win"
          ? "你赢下来了。也许不漂亮，但这种夜里漂亮不是第一需求，活下来才是。"
          : outcome === "draw"
            ? "没赢，但至少没把自己提前送进头版事故区。"
            : "比分出来的那一刻，看台上那种“熟悉的味道”又回来了。",
      };
      state.view = "result";
      render();
    }

    function buildScore(outcome, tactic, chance, concedeRisk) {
      if (outcome === "win") {
        const our = chance > 65 ? rand(2, 3) : rand(1, 2);
        const their = concedeRisk > 4 ? rand(1, Math.max(1, our - 1)) : rand(0, Math.max(0, our - 1));
        return [our, Math.min(their, our - 1)];
      }
      if (outcome === "draw") {
        if (tactic === "defend") return [0, 0];
        return [1, 1];
      }
      const their = concedeRisk > 4 ? rand(2, 3) : rand(1, 2);
      const our = tactic === "allin" ? rand(1, Math.max(1, their - 1)) : rand(0, Math.max(0, their - 1));
      return [Math.min(our, their - 1), their];
    }

    function buildReasons(outcome, tactic, attitude, concedeRisk) {
      const reasons = [];
      if (state.resources.fitness <= 45) {
        reasons.push("前几周透支过多，球队体能在后段明显掉速。");
      }
      if (state.resources.pressure >= 60) {
        reasons.push("舆论压力太高，全队处理球开始越来越怕出错。");
      }
      if (state.resources.trust <= 45) {
        reasons.push("更衣室信任不够，中场调整打了折扣。");
      }
      if (tactic.win > 6 || state.selectedMatchConfig.tactic === "allin") {
        reasons.push("你把比赛往更激进的方向推了，收益和风险都放大了。");
      }
      if (attitude.pressure > 0 || state.selectedMatchConfig.attitude === "must") {
        reasons.push("“必须拿下”的心态让比赛后半段更容易发热。");
      }
      if (concedeRisk > 4 && outcome !== "win") {
        reasons.push("你在最后时刻继续上强度，后场被反击打穿。");
      }
      if (!reasons.length) {
        reasons.push("这场更多是细节差一口气，国足最熟悉的那种差。");
      }
      return reasons.slice(0, 3);
    }

    function getPostMatchReaction(outcome, score, penaltyNote = "") {
      const goalDiff = Math.abs((score?.[0] || 0) - (score?.[1] || 0));
      const totalGoals = (score?.[0] || 0) + (score?.[1] || 0);
      let reactionKey = outcome;

      if (penaltyNote) {
        reactionKey = outcome === "win" ? "win_penalty" : outcome === "loss" ? "loss_penalty" : outcome;
      } else if (outcome === "win") {
        reactionKey = goalDiff >= 2 ? "win_clean" : "win";
      } else if (outcome === "draw") {
        reactionKey = totalGoals === 0 ? "draw_flat" : "draw_open";
      } else if (outcome === "loss") {
        reactionKey = goalDiff >= 2 ? "loss_heavy" : "loss_narrow";
      }

      const bucket = POST_MATCH_REACTIONS[reactionKey] || POST_MATCH_REACTIONS[outcome] || POST_MATCH_REACTIONS.draw;
      return {
        headline: pick(bucket.headlines),
        fan: pick(bucket.fans),
        pundit: pick(bucket.pundits),
        pressQuote: pick(bucket.pressQuotes)
      };
    }

    function applyWorldCupResult(outcome, score, opponentName) {
      const me = state.worldCup.teams[0];
      const opponent = state.worldCup.teams.find((team) => team.name === opponentName);
      applyStandingsResult(me, opponent, score[0], score[1]);
      simulateOtherWorldCupMatch(state.worldCup.round);
    }

    function applyStandingsResult(teamA, teamB, gfA, gfB) {
      teamA.gf += gfA;
      teamA.ga += gfB;
      teamA.gd = teamA.gf - teamA.ga;
      teamB.gf += gfB;
      teamB.ga += gfA;
      teamB.gd = teamB.gf - teamB.ga;
      if (gfA > gfB) {
        teamA.pts += 3;
      } else if (gfB > gfA) {
        teamB.pts += 3;
      } else {
        teamA.pts += 1;
        teamB.pts += 1;
      }
    }

    function simulateOtherWorldCupMatch(roundIndex) {
      const t = state.worldCup.teams;
      let pair;
      if (roundIndex === 0) pair = [t[2], t[3]];
      else if (roundIndex === 1) pair = [t[1], t[3]];
      else pair = [t[1], t[2]];

      const teamA = pair[0];
      const teamB = pair[1];
      const teamABase = 45;
      const aWin = clamp(teamABase + rand(-8, 8), 20, 60);
      const roll = rand(1, 100);
      let scoreA = 1;
      let scoreB = 1;
      if (roll < aWin) {
        scoreA = rand(1, 3);
        scoreB = rand(0, scoreA - 1);
      } else if (roll < aWin + 28) {
        scoreA = rand(0, 2);
        scoreB = scoreA;
      } else {
        scoreB = rand(1, 3);
        scoreA = rand(0, scoreB - 1);
      }
      applyStandingsResult(teamA, teamB, scoreA, scoreB);
      addNews("世界杯另一场", `${teamA.name} ${scoreA}:${scoreB} ${teamB.name}`, "另一块球场的比分也到了，你的计算器现在更忙了。");
    }

    function getWorldCupRanking() {
      return [...state.worldCup.teams].sort(compareTableRows);
    }

    function chooseCoach(id) {
      state.coach = COACH_STYLES.find((item) => item.id === id);
      trackFeedbackEvent("choose_coach", { coachId: id });
      state.phase = "sponsor";
      state.view = "sponsor";
      state.stepper.sponsor = 0;
      render();
    }

    function chooseSponsor(id) {
      state.sponsor = SPONSORS.find((item) => item.id === id);
      trackFeedbackEvent("choose_sponsor", { sponsorId: id });
      state.phase = "prep";
      state.week = 0;
      state.stepper.round = 0;
      setupGame();
      nextRound();
    }

    function restartGame() {
      trackFeedbackEvent("restart_game", {
        fromPhase: state.phase,
        year: state.currentYear
      });
      state.currentYear += 4;
      state.phase = "intro";
      state.week = 0;
      state.coach = null;
      state.sponsor = null;
      state.resources = null;
      state.roundType = null;
      state.roundData = null;
      state.currentOptions = [];
      state.pendingEvent = null;
      state.selectedStrategy = null;
      state.selectedMatchConfig = null;
      state.matchFlow = null;
      state.shopStock = [];
      state.qualifiers = null;
      state.worldCup = null;
      state.knockout = null;
      state.news = [];
      state.ending = null;
      state.groupContinueOffered = false;
      state.stepper = {
        coach: 0,
        sponsor: 0,
        round: 0
      };
      state.drawer = {
        open: false,
        tab: "news"
      };
      render();
    }

    function handleAction(action, target) {
      if (action === "start") {
        return nextRound();
      }
      if (action === "choose-coach") {
        return chooseCoach(target.dataset.id);
      }
      if (action === "select-step") {
        const key = target.dataset.key;
        const totalMap = {
          coach: COACH_STYLES.length,
          sponsor: SPONSORS.length,
          round: state.currentOptions.length
        };
        const total = totalMap[key] || 0;
        if (!total) return;
        state.stepper[key] = clamp(Number(target.dataset.index || 0), 0, total - 1);
        return render();
      }
      if (action === "choose-sponsor") {
        return chooseSponsor(target.dataset.id);
      }
      if (action === "pick-strategy") {
        return pickStrategy(target.dataset.id);
      }
      if (action === "refresh-shop") {
        return refreshShopStock();
      }
      if (action === "buy-item") {
        return buyShopItem(target.dataset.id);
      }
      if (action === "pick-event-option") {
        return applyEventOption(target.dataset.index);
      }
      if (action === "start-match") {
        return startMatch();
      }
      if (action === "match-choice") {
        return matchChoice(target.dataset.index);
      }
      if (action === "continue") {
        return nextRound();
      }
      if (action === "playoff-match") {
        state.phase = "qualifiers";
        state.view = "match-setup";
        state.roundData.type = "qualifier-playoff";
        state.selectedStrategy = { title: "背水一战", effect: {} };
        return render();
      }
      if (action === "give-up") {
        return endGame("熟悉的附加赛");
      }
      if (action === "continue-knockout") {
        state.phase = "knockout";
        state.knockout.active = true;
        state.knockout.round = 0;
        addNews("淘汰赛", "32 强正式开启", "从这里开始，每一场都要分出胜负。赢一场不是常规发挥，是在改写口口相传的国足剧本。");
        return enterStrategyRound();
      }
      if (action === "end-history") {
        return endGame("创造历史");
      }
      if (action === "open-drawer") {
        state.drawer.open = true;
        state.drawer.tab = target.dataset.tab || "news";
        return renderDrawer();
      }
      if (action === "switch-drawer-tab") {
        state.drawer.tab = target.dataset.tab || "news";
        return renderDrawer();
      }
      if (action === "close-drawer") {
        state.drawer.open = false;
        return renderDrawer();
      }
      if (action === "restart") {
        return restartGame();
      }
    }

    document.addEventListener("click", (event) => {
      const target = event.target.closest("[data-action]");
      if (!target) return;
      handleAction(target.dataset.action, target);
    });

    window.addEventListener("resize", () => {
      schedulePanelScale();
      resizeMatchCanvasPrototype();
    });
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", () => {
        schedulePanelScale();
        resizeMatchCanvasPrototype();
      });
    }
    document.addEventListener("load", (event) => {
      if (event.target instanceof HTMLImageElement && $("#panelBody")?.contains(event.target)) {
        schedulePanelScale();
      }
    }, true);
    if (document.fonts?.ready) {
      document.fonts.ready.then(() => schedulePanelScale());
    }

    window.Feedback?.initFeedback({
      project: FEEDBACK_PROJECT,
      supabaseUrl: FEEDBACK_SUPABASE_URL,
      supabaseKey: FEEDBACK_SUPABASE_KEY
    });
    state.view = "intro";
    render();
  </script>
</body>
</html>
