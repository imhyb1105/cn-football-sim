<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>跨域连接诊断</title>
<style>body{font:14px system-ui,sans-serif;max-width:600px;margin:40px auto;padding:20px;background:#fefcf9}.p{background:#fff;padding:10px;margin:6px 0;border-radius:6px;border:1px solid #e0e0e0}.ok{color:green}.fail{color:red}pre{background:#f5f5f5;padding:6px;font-size:11px;overflow-x:auto}</style></head>
<body>
<h2>跨域连接诊断 (Cross-Origin Test)</h2>
<p>本页面在 <b id="origin"></b> 下运行，将测试跨域请求到 <code>dashboard.tianjiwantong.com.cn</code></p>
<div id="results"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
document.getElementById('origin').textContent = location.origin;
var SUPABASE_URL = 'https://dashboard.tianjiwantong.com.cn/api/supabase';
var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhyZXN6dmNscXhldGZ5aGNsZ3B3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMxMzU3MzYsImV4cCI6MjA5ODcxMTczNn0.zrHVe87P9DpsTWrkaClCnlr0yTz2rgmrwfHnOTwsb8A';
var out = document.getElementById('results');

function log(msg, cls) {
  var d = document.createElement('div');
  d.className = 'p ' + (cls || '');
  d.innerHTML = msg;
  out.appendChild(d);
}

async function test() {
  log('<b>步骤 1: 检查本页 Origin</b>');
  log('当前 Origin: <code>' + location.origin + '</code><br>目标 API: <code>' + SUPABASE_URL + '</code><br><b style="color:red">这是跨域请求！</b>');

  log('<b>步骤 2: 创建跨域客户端</b>');
  var sb;
  try {
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    log('✅ 客户端创建成功', 'ok');
  } catch(e) {
    log('❌ 失败: ' + e.message, 'fail'); return;
  }

  log('<b>步骤 3: 跨域 GET 查询</b>');
  try {
    var t0 = Date.now();
    var r = await sb.from('feedbacks').select('id').limit(1);
    var t1 = Date.now();
    if (r.error) {
      log('❌ GET 错误 (' + (t1-t0) + 'ms): ' + r.error.message, 'fail');
    } else {
      log('✅ GET 成功 (' + (t1-t0) + 'ms), ' + r.data.length + ' 条记录', 'ok');
    }
  } catch(e) {
    log('❌ GET 异常: ' + e.message, 'fail');
  }

  log('<b>步骤 4: 跨域 POST 写入 usage_events</b>');
  try {
    var t0 = Date.now();
    var r = await sb.from('usage_events').insert({
      project: 'cn-football-sim',
      session_id: 'cors-diag-' + Date.now(),
      event: 'cors_test',
      metadata: { origin: location.origin, time: new Date().toISOString() }
    });
    var t1 = Date.now();
    if (r.error) {
      log('❌ POST 错误 (' + (t1-t0) + 'ms): ' + r.error.message + '<pre>' + JSON.stringify(r.error, null, 2) + '</pre>', 'fail');
    } else {
      log('✅ POST 成功 (' + (t1-t0) + 'ms)', 'ok');
    }
  } catch(e) {
    log('❌ POST 异常 (' + (t1-t0) + 'ms): ' + e.message + ' | 这通常表示 CORS 被浏览器拦截', 'fail');
  }

  log('<b>步骤 5: 跨域 POST 写入反馈</b>');
  try {
    var t0 = Date.now();
    var r = await sb.from('feedbacks').insert({
      project: 'cn-football-sim',
      session_id: 'cors-diag-' + Date.now(),
      type: 'other',
      title: '跨域诊断测试',
      content: '跨域测试 from ' + location.origin
    });
    var t1 = Date.now();
    if (r.error) {
      log('❌ POST 错误 (' + (t1-t0) + 'ms): ' + r.error.message, 'fail');
    } else {
      log('✅ POST 成功 (' + (t1-t0) + 'ms)', 'ok');
    }
  } catch(e) {
    log('❌ POST 异常 (' + (t1-t0) + 'ms): ' + e.message, 'fail');
  }

  log('<b>诊断完成。如果步骤 3-5 都成功，跨域请求正常工作。</b>');
}
test().catch(function(e) { log('❌ 脚本异常: ' + e.message, 'fail'); });
</script>
</body>
</html>
